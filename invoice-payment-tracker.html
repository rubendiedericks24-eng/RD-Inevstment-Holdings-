<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Workshop PE — Invoices</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Saira:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--surface:#fff;--line:#E2E8F0;--text:#0F172A;--muted:#475569;--subtle:#94A3B8;--navy:#0F172A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Saira,sans-serif}
.side{position:fixed;inset:0 auto 0 0;width:220px;background:#fff;border-right:1px solid var(--line);padding:18px 0}
.brand{padding:0 16px 14px;font-family:'Saira Condensed',sans-serif;font-weight:700}
.sub{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--subtle)}
a{display:block;padding:10px 16px;color:var(--muted);text-decoration:none;font-size:.88rem}
a.on{color:var(--navy);font-weight:600;background:#F1F5F9}
main{margin-left:220px;padding:28px}
h1{font-family:'Saira Condensed',sans-serif;font-size:1.6rem}
p{color:var(--muted);margin:6px 0 16px}
button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-weight:600}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:.84rem}
th{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--subtle);text-transform:uppercase}
.gate{position:fixed;inset:0;background:#0F172A;display:flex;align-items:center;justify-content:center}
.gate.ok{display:none}
.box{background:#fff;padding:24px;border-radius:8px;width:320px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid var(--line)}
@media(max-width:700px){.side{display:none}.main{margin-left:0;padding:16px}}
</style>
</head>
<body>
<div class="gate" id="gate"><form class="box" onsubmit="return openGate(event)"><h1>Auto Workshop PE</h1><p>Staff view only.</p><input id="pw" type="password" placeholder="Password"><button type="submit">Open</button></form></div>
<aside class="side"><div class="brand">Auto Workshop PE<div class="sub">NexAgent OS</div></div>
<a href="operations-dashboard.html">Dashboard</a>
<a href="job-card-tracker.html">Jobs</a>
<a href="auto-quote-generator.html">Quotes</a>
<a href="invoice-payment-tracker.html" class="on">Invoices</a>
</aside>
<main><h1>Invoices</h1><p>Sheet view. No create, no edit. Refresh only.</p><button onclick="load()">Refresh</button><div id="out"></div></main>
<script>
const URL_='https://script.google.com/macros/s/AKfycbzcv7Cbp_JeBZiCUTCWVEDkV6BvO4d3tDz8ivx-HR5qHos-xTROolb8F146G2SCyUPk/exec';
const TAB="Invoices";
function openGate(e){e.preventDefault();if(document.getElementById('pw').value.trim()==='NexOS-PE'){sessionStorage.setItem('nexagent_pe_gate_v1','1');document.getElementById('gate').classList.add('ok');load();}return false;}
if(sessionStorage.getItem('nexagent_pe_gate_v1')==='1')document.getElementById('gate').classList.add('ok');
function cell(v){return String(v==null?'':v).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');}
async function load(){
  const out=document.getElementById('out');
  out.innerHTML='<p>Loading.</p>';
  try{
    const rows=await (await fetch(URL_+'?tab='+encodeURIComponent(TAB)+'&key=NexOS-PE')).json();
    if(!Array.isArray(rows)||!rows.length){out.innerHTML='<p>No rows.</p>';return;}
    const cols=Object.keys(rows[0]).slice(0,8);
    out.innerHTML='<table><tr>'+cols.map(c=>'<th>'+cell(c)+'</th>').join('')+'</tr>'+rows.slice(0,80).map(r=>'<tr>'+cols.map(c=>'<td>'+cell(r[c])+'</td>').join('')+'</tr>').join('')+'</table>';
  }catch(e){out.innerHTML='<p>Sheet did not load.</p>';}
}
if(sessionStorage.getItem('nexagent_pe_gate_v1')==='1')load();
</script>
</body></html>
