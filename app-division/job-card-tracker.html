<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Workshop — Job Card Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Saira:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFC;--surface:#FFFFFF;--surface2:#F1F5F9;
  --border:#E2E8F0;--border-dk:#CBD5E1;
  --text:#0F172A;--muted:#475569;--subtle:#94A3B8;
  --navy:#0F172A;--navy2:#334155;--accent:#0F172A;
  --green:#16A34A;--green-lt:rgba(22,163,74,.07);--green-border:rgba(22,163,74,.25);
  --yellow:#D97706;--amber:#D97706;
  --amber-lt:rgba(217,119,6,.08);--amber-border:rgba(217,119,6,.25);
  --red:#DC2626;--red-lt:rgba(220,38,38,.06);--red-border:rgba(220,38,38,.25);
  --blue:#2563EB;--blue-lt:rgba(37,99,235,.06);--blue-border:rgba(37,99,235,.25);
  --purple:#7C3AED;--purple-lt:rgba(124,58,237,.06);--purple-border:rgba(124,58,237,.25);
  --wa:#25D366;
  --shadow:0 1px 2px rgba(15,23,42,.04);--shadow-md:0 4px 24px rgba(15,23,42,.08);--shadow-lg:0 8px 48px rgba(15,23,42,.14);
  --disp:'Saira Condensed',sans-serif;--body:'Saira',sans-serif;--mono:'IBM Plex Mono',monospace;
  --radius:4px;--sidebar:230px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:14px}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh}
input,select,textarea,button{font-family:var(--body);font-size:inherit;color:inherit}

/* ── SIDEBAR ── */
.sidebar{position:fixed;left:0;top:0;width:var(--sidebar);min-height:100vh;background:var(--bg);border-right:1px solid var(--border);z-index:100;display:flex;flex-direction:column}
.sidebar-brand{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
.brand-name{font-family:var(--disp);font-size:.95rem;font-weight:900;color:var(--navy);line-height:1.2}
.brand-sub{font-family:var(--mono);font-size:.65rem;color:var(--subtle);letter-spacing:.06em;margin-top:2px}
.sidebar-nav{padding:10px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 18px 9px 15px;cursor:pointer;font-size:.85rem;font-weight:500;color:var(--muted);margin-bottom:1px;transition:all .1s;border-left:3px solid transparent;text-decoration:none}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--surface2);color:var(--navy);border-left-color:var(--navy);font-weight:600}
.sidebar-footer{padding:12px 18px;border-top:1px solid var(--border);font-family:var(--mono);font-size:.62rem;color:var(--subtle);letter-spacing:.04em}

/* ── MAIN ── */
.main{margin-left:var(--sidebar);min-height:100vh;padding:32px 36px}
@media(max-width:700px){.sidebar{display:flex;transform:translateX(-110%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:56px 16px 20px}}

/* ── PAGE HEADER ── */
.pg-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:26px;gap:12px;flex-wrap:wrap}
.pg-title{font-family:var(--disp);font-size:1.35rem;font-weight:900;color:var(--text);letter-spacing:-.3px}
.pg-sub{font-size:.82rem;color:var(--muted);margin-top:3px}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:16px;background:none;border:none;padding:5px 0;transition:color .15s}
.back-btn:hover{color:var(--navy)}

/* ── STAT GRID ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat-label{font-family:var(--mono);font-size:.65rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--subtle);margin-bottom:6px}
.stat-val{font-family:var(--disp);font-size:1.75rem;font-weight:900;line-height:1;letter-spacing:-.5px}

/* ── CARD ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-family:var(--mono);font-size:.7rem;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--subtle)}
.section-label{font-family:var(--mono);font-size:.65rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--subtle);margin-bottom:12px}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
table.tbl thead tr{background:var(--surface2)}
table.tbl th{padding:9px 14px;text-align:left;font-family:var(--mono);font-size:.63rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--subtle);border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl td{padding:11px 14px;font-size:.875rem;border-bottom:1px solid var(--border)}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl tbody tr.clickable{cursor:pointer;transition:background .1s}
table.tbl tbody tr.clickable:hover{background:var(--bg)}
.job-num{font-family:var(--mono);font-weight:500;color:var(--navy)}
.client-name{font-weight:600}
.client-phone{font-size:.75rem;color:var(--muted);margin-top:2px}
.job-desc{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.date-cell{color:var(--subtle);font-size:.82rem;white-space:nowrap}

/* ── BADGES ── */
.badge{padding:3px 9px;border-radius:4px;font-family:var(--mono);font-size:.63rem;font-weight:500;text-transform:uppercase;letter-spacing:.04em;display:inline-block}
.badge-pending{background:var(--surface2);color:var(--muted);border:1px solid var(--border-dk)}
.badge-inprogress{background:var(--amber-lt);color:var(--amber);border:1px solid var(--amber-border)}
.badge-done{background:var(--green-lt);color:var(--green);border:1px solid var(--green-border)}

/* ── FILTER CHIPS ── */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:5px 13px;border-radius:20px;font-size:.78rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:all .12s}
.chip:hover{border-color:var(--border-dk);color:var(--text)}
.chip.active{background:#0F172A;color:#FFFFFF;border-color:#0F172A}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;font-size:.84rem;font-weight:600;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;font-family:var(--body)}
.btn-primary{background:#0F172A;color:#FFFFFF;border:1.5px solid #0F172A}
.btn-primary:hover{background:transparent;color:#0F172A;border-color:#0F172A}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border-dk)}
.btn-secondary:hover{border-color:var(--navy);color:var(--navy)}
.btn-amber{background:var(--amber-lt);color:var(--amber);border:1px solid var(--amber-border)}
.btn-amber:hover{background:var(--amber);color:#fff}
.btn-danger{background:var(--surface);color:var(--red);border:1px solid var(--border)}
.btn-danger:hover{background:var(--red-lt);border-color:var(--red)}
.btn-sm{padding:6px 13px;font-size:.78rem;border-radius:7px}
.btn-link{background:none;border:none;color:var(--navy);font-size:.82rem;font-weight:600;cursor:pointer;padding:0}

/* ── FORM FIELDS ── */
.field{margin-bottom:14px}
.field label{display:block;font-family:var(--mono);font-size:.65rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--subtle);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--border-dk);border-radius:8px;background:var(--surface);color:var(--text);font-size:.875rem;outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,23,42,.08)}
.field input::placeholder,.field textarea::placeholder{color:var(--subtle)}
.field textarea{resize:vertical;min-height:80px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.search-input{padding:8px 12px;border:1px solid var(--border-dk);border-radius:8px;background:var(--surface);font-size:.84rem;outline:none;width:240px;transition:border-color .15s}
.search-input:focus{border-color:var(--navy)}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:52px 24px;color:var(--subtle)}
.empty-icon{font-size:2rem;margin-bottom:10px}
.empty-title{font-size:1rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.empty-sub{font-size:.83rem}

/* ── JOB DETAIL ── */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.info-lbl{font-family:var(--mono);font-size:.63rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--subtle);margin-bottom:4px}
.info-val{font-size:.92rem;font-weight:600}
.info-sub{font-size:.78rem;color:var(--muted);margin-top:2px}
.alert{padding:11px 14px;border-radius:8px;font-size:.82rem;display:flex;align-items:center;gap:9px}
.alert-success{background:var(--green-lt);border:1px solid var(--green-border);color:var(--green)}

/* ── TOAST ── */
.toast-el{position:fixed;bottom:26px;right:26px;padding:11px 20px;border-radius:9px;font-size:.84rem;font-weight:600;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;z-index:999;box-shadow:var(--shadow-md)}
.toast-el.show{opacity:1;transform:translateY(0)}
.toast-el.success{background:var(--surface2);border:1px solid rgba(15,23,42,.12);color:var(--text)}
.toast-el.error{background:var(--red);color:#fff}

/* NexAgent gate + phone nav */
.nex-gate{position:fixed;inset:0;z-index:9999;background:#0F172A;display:flex;align-items:center;justify-content:center;padding:24px}
.nex-gate.ok{display:none}
.nex-gate-box{width:100%;max-width:340px;background:#fff;border-radius:8px;padding:28px 24px;font-family:'Saira',sans-serif}
.nex-gate-box h2{font-family:'Saira Condensed',sans-serif;font-size:1.4rem;margin:0 0 6px;color:#0F172A}
.nex-gate-box p{font-size:.85rem;color:#475569;margin:0 0 16px}
.nex-gate-box input{width:100%;padding:14px 12px;border:1px solid #E2E8F0;border-radius:4px;font-size:16px;margin-bottom:10px}
.nex-gate-box button{width:100%;padding:14px;background:#0F172A;color:#fff;border:0;border-radius:4px;font-weight:600;cursor:pointer;min-height:44px}
.nex-gate-err{color:#DC2626;font-size:.8rem;min-height:1.1em;margin:0 0 8px}
.nex-burger{display:none;position:fixed;top:12px;left:12px;z-index:220;width:44px;height:44px;border:1px solid #E2E8F0;background:#fff;border-radius:4px;font-size:20px;cursor:pointer}
.nex-dim{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:150}
@media(max-width:700px){
  .nex-burger{display:block}
  .nex-dim.on{display:block}
  .sidebar{display:flex !important;transform:translateX(-110%);transition:transform .2s;z-index:210;width:min(280px,86vw)}
  .sidebar.open{transform:translateX(0);box-shadow:8px 0 32px rgba(15,23,42,.18)}
  .main{margin-left:0;padding:56px 12px 24px}
  .nav-item{min-height:44px}
  .btn,.btn-primary,.btn-secondary,button.btn{min-height:44px}
  input,select,textarea{font-size:16px !important}
  .tbl-wrap{overflow:visible}
  table.tbl thead{display:none}
  table.tbl,table.tbl tbody,table.tbl tr,table.tbl td{display:block;width:100%}
  table.tbl tbody tr.clickable{border:1px solid var(--border);border-radius:8px;margin:0 0 10px;padding:12px 14px;background:var(--surface)}
  table.tbl td{border:0;padding:3px 0}
  .job-desc{max-width:none;white-space:normal}
  .stat-grid{grid-template-columns:repeat(2,1fr) !important}
  .panel-grid{grid-template-columns:1fr !important}
  .grid2,.info-grid{grid-template-columns:1fr !important}
  .search-input{width:100%}
  .pg-header{flex-direction:column;align-items:flex-start}
  .toast-el{left:16px;right:16px;bottom:16px}
}
</style>
</head>
<body>

<button class="nex-burger" type="button" id="nexBurger" aria-label="Menu">☰</button>
<div class="nex-dim" id="nexDim"></div>
<div class="nex-gate" id="nexGate">
  <form class="nex-gate-box" onsubmit="return nexUnlock(event)">
    <h2>Auto Workshop PE</h2>
    <p>Staff login. Clients do not use this page.</p>
    <p class="nex-gate-err" id="nexGateErr"></p>
    <input id="nexGatePw" type="password" placeholder="Password" autocomplete="current-password">
    <button type="submit">Open</button>
  </form>
</div>

<div id="app"></div>
<div id="toast" class="toast-el"></div>
<script>
const SHEETS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbzcv7Cbp_JeBZiCUTCWVEDkV6BvO4d3tDz8ivx-HR5qHos-xTROolb8F146G2SCyUPk/exec';

async function syncJobsFromSheet(){
  try{
    const res=await fetch(`${SHEETS_SCRIPT_URL}?tab=Job%20Bookings&key=NexOS-PE`);
    const rows=await res.json();
    if(!Array.isArray(rows))return;
    const currentJobs=DB.getJobs();
    // Build fingerprint set from existing local jobs to avoid duplicates
    const fp=j=>[(j.clientName||'').toLowerCase().trim(),(j.clientPhone||'').replace(/\D/g,''),(j.date||'').slice(0,10)].join('|');
    const existing=new Set(currentJobs.map(fp));
    try{localStorage.removeItem('jct_deleted');}catch(e){}
    let nextNum=currentJobs.reduce((m,j)=>Math.max(m,parseInt(j.id.replace('JOB-',''))||0),0);
    const genId=()=>'JOB-'+String(++nextNum).padStart(3,'0');
    const statusMap={'OPEN':'Pending','IN PROGRESS':'In Progress','DONE':'Done','COMPLETE':'Done','CLOSED':'Done'};
    const newJobs=[...currentJobs];
    let added=0;
    for(const row of rows){
      const name=(row['Customer Name']||'').trim();
      if(!name)continue;
      const phone=String(row['Contact Number']||'').replace(/\D/g,'');
      const rawDate=String(row['Date']||'');
      const dateStr=rawDate?rawDate.slice(0,10):today();
      const key=[name.toLowerCase(),phone,dateStr].join('|');
      if(existing.has(key))continue;
      const sheetStatus=(row['Status']||'OPEN').toUpperCase().trim();
      const localStatus=statusMap[sheetStatus]||'Pending';
      const vehicle=(row['Vehicle']||'').trim();
      const jobType=(row['Job Type']||'').trim();
      const desc=[jobType,vehicle?`Vehicle: ${vehicle}`:''].filter(Boolean).join(' — ')||'Job from quote';
      newJobs.push({id:genId(),date:dateStr,clientName:name,clientPhone:phone,jobDescription:desc,technician:'',quoteRef:'',status:localStatus,notes:vehicle?`Vehicle: ${vehicle}`:'',completedAt:null,createdAt:rawDate||new Date().toISOString(),_sheetImport:true});
      existing.add(key);
      added++;
    }
    if(added>0){DB.saveJobs(newJobs);S.jobs=newJobs;render();toast(`${added} job${added>1?'s':''} synced from Google Sheets`);}
    else toast('Up to date — no new jobs');
  }catch(e){console.error('Sheet sync failed:',e);toast('Sheet sync failed — check console','error');}
}

const DB={
  getJobs:()=>JSON.parse(localStorage.getItem('jct_jobs')||'[]'),
  saveJobs:j=>localStorage.setItem('jct_jobs',JSON.stringify(j)),
  getConfig:()=>JSON.parse(localStorage.getItem('jct_config')||JSON.stringify({businessName:'Auto Workshop PE',technicianList:['Andile','Sipho','James'],makeWebhookUrl:'',sheetsScriptUrl:''})),
  saveConfig:c=>localStorage.setItem('jct_config',JSON.stringify(c)),
  nextId:()=>{const jobs=JSON.parse(localStorage.getItem('jct_jobs')||'[]');const max=jobs.reduce((m,j)=>Math.max(m,parseInt(j.id.replace('JOB-',''))||0),0);return 'JOB-'+String(max+1).padStart(3,'0');}
};
let S={page:'dashboard',selectedJobId:null,filterStatus:'all',searchQuery:'',jobs:DB.getJobs(),config:DB.getConfig()};
function set(u){S={...S,...u};render();}
function createJob(data){const job={id:DB.nextId(),date:today(),clientName:data.clientName.trim(),clientPhone:data.clientPhone.trim(),jobDescription:data.jobDescription.trim(),technician:data.technician,quoteRef:(data.quoteRef||'').trim(),partsUsed:(data.partsUsed||'').trim(),status:'Pending',notes:(data.notes||'').trim(),completedAt:null,createdAt:new Date().toISOString()};const jobs=[...S.jobs,job];DB.saveJobs(jobs);set({jobs,page:'dashboard'});toast('Job card created: '+job.id);syncToSheets(job,'upsert');notifyJobCreated(job);}
async function notifyJobCreated(job){const TRACKER_URL='https://hook.us2.make.com/b87t3jq9ek60abusvn767oi7cklp5fxu';try{let ph=(job.clientPhone||'').replace(/\D/g,'');if(ph.startsWith('0'))ph='27'+ph.slice(1);await fetch(TRACKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:'job_created',jobId:job.id,clientName:job.clientName,clientPhone:ph,jobDescription:job.jobDescription,technician:job.technician,quoteRef:job.quoteRef||'',date:job.date,businessName:S.config.businessName})});}catch(e){}}
function setStatus(jobId,newStatus){const liveParts=document.getElementById('parts-used-field');const jobs=S.jobs.map(j=>j.id!==jobId?j:{...j,partsUsed:liveParts?liveParts.value.trim():(j.partsUsed||''),status:newStatus,completedAt:newStatus==='Done'?new Date().toISOString():j.completedAt});DB.saveJobs(jobs);set({jobs});const updated=jobs.find(j=>j.id===jobId);if(newStatus==='Done'){fireWebhook(updated);toast('Job complete — WhatsApp notification sent');}else toast('Status updated → '+newStatus);syncToSheets(updated,'upsert');}
function saveNotes(jobId,notes){const jobs=S.jobs.map(j=>j.id===jobId?{...j,notes}:j);DB.saveJobs(jobs);set({jobs});toast('Notes saved');syncToSheets(jobs.find(j=>j.id===jobId),'upsert');}
function savePartsUsed(jobId,partsUsed){const jobs=S.jobs.map(j=>j.id===jobId?{...j,partsUsed:(partsUsed||'').trim()}:j);DB.saveJobs(jobs);set({jobs});toast('Parts saved');}
function deleteJob(jobId){if(!confirm('Delete this job card?'))return;const job=S.jobs.find(j=>j.id===jobId);const jobs=S.jobs.filter(j=>j.id!==jobId);DB.saveJobs(jobs);set({jobs,page:'all-jobs'});toast('Deleted','error');if(job){syncToSheets(job,'delete');
      (async()=>{try{let ph=(job.clientPhone||'').replace(/\D/g,'');if(ph.startsWith('0'))ph='27'+ph.slice(1);await fetch('https://hook.us2.make.com/b87t3jq9ek60abusvn767oi7cklp5fxu',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:'job_deleted',clientName:job.clientName,clientPhone:ph,jobDescription:job.jobDescription})});}catch(e){}})();
}}
async function fireWebhook(job){const WEBHOOK_URL='https://hook.us2.make.com/b87t3jq9ek60abusvn767oi7cklp5fxu';try{let ph=(job.clientPhone||'').replace(/\D/g,'');if(ph.startsWith('0'))ph='27'+ph.slice(1);await fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:'job_completed',clientName:job.clientName,clientPhone:ph,jobDescription:job.jobDescription,technician:job.technician,quoteRef:job.quoteRef||'',partsUsed:job.partsUsed||'',completedAt:job.completedAt,businessName:S.config.businessName})});}catch(e){}}
async function syncToSheets(job,action='upsert'){if(!S.config.sheetsScriptUrl||!job)return;try{await fetch(S.config.sheetsScriptUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,id:job.id,clientName:job.clientName,clientPhone:job.clientPhone,jobDescription:job.jobDescription,technician:job.technician,status:action==='delete'?'DELETED':job.status,date:job.date,notes:job.notes||'',completedAt:job.completedAt||'',updatedAt:new Date().toISOString()})});}catch(e){}}
async function syncAllToSheets(){if(!S.config.sheetsScriptUrl){toast('No Sheets script URL configured','error');return;}toast('Syncing all jobs…');for(const job of S.jobs){await syncToSheets(job,'upsert');}toast('All jobs synced to Google Sheets');}
function saveSettings(data){const config={businessName:data.businessName||'Workshop',technicianList:(data.technicianList||'').split('\n').map(t=>t.trim()).filter(Boolean),makeWebhookUrl:data.makeWebhookUrl||'',sheetsScriptUrl:data.sheetsScriptUrl||''};DB.saveConfig(config);set({config});toast('Settings saved');}
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=iso=>iso?new Date(iso).toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'}):'—';
const fmtDT=iso=>iso?new Date(iso).toLocaleString('en-ZA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function badge(s){const m={Pending:'badge-pending','In Progress':'badge-inprogress',Done:'badge-done'};return`<span class="badge ${m[s]||''}">${esc(s)}</span>`;}
function stats(){const t=today();return{total:S.jobs.length,pending:S.jobs.filter(j=>j.status==='Pending').length,inProgress:S.jobs.filter(j=>j.status==='In Progress').length,doneToday:S.jobs.filter(j=>j.status==='Done'&&j.completedAt?.slice(0,10)===t).length};}
function filtered(){return S.jobs.filter(j=>S.filterStatus==='all'||j.status===S.filterStatus).filter(j=>{if(!S.searchQuery)return true;const q=S.searchQuery.toLowerCase();return[j.clientName,j.technician,j.id,j.jobDescription].some(f=>f?.toLowerCase().includes(q));}).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));}
const IC={

ding:18px 22px;margin-bottom:14px"><div class="section-label">Update Status</div><div style="display:flex;gap:9px;flex-wrap:wrap">${job.status!=='Pending'?`<button class="btn btn-secondary btn-sm" data-status="Pending" data-jobid="${esc(job.id)}">Set Pending</button>`:''} ${job.status!=='In Progress'?`<button class="btn btn-amber btn-sm" data-status="In Progress" data-jobid="${esc(job.id)}">In Progress</button>`:''}<button class="btn btn-primary btn-sm" data-status="Done" data-jobid="${esc(job.id)}">${IC.check} Mark Done</button></div><div style="font-size:.75rem;color:var(--muted);margin-top:10px">Marking Done fires Make.com webhook → WhatsApp notification to client</div></div>`:''}<div class="card" style="padding:18px 22px;margin-bottom:14px"><div class="section-label">Notes</div><div class="field" style="margin-bottom:10px"><textarea id="notes-field" placeholder="Parts used, extra work, client notes…">${esc(job.notes)}</textarea></div><button id="save-notes-btn" class="btn btn-secondary btn-sm" data-jobid="${esc(job.id)}">Save Notes</button></div><div style="display:flex;justify-content:flex-end"><button class="btn btn-danger btn-sm" data-delete="${esc(job.id)}">Delete Job Card</button></div></div>`;

function pgSettings(){
  const c=S.config;
  const scriptCode=`function doPost(e){
  try{
    var d=JSON.parse(e.postData.contents);
    var ss=SpreadsheetApp.getActiveSpreadsheet();
    var sh=ss.getSheets()[0];
    var hdr=['Job ID','Client','Phone','Description','Technician','Status','Date','Notes','Completed','Updated'];
    if(sh.getLastRow()===0)sh.appendRow(hdr);
    var rows=sh.getDataRange().getValues();
    var found=-1;
    for(var i=1;i<rows.length;i++){if(rows[i][0]===d.id){found=i+1;break;}}
    var row=[d.id,d.clientName,d.clientPhone,d.jobDescription,d.technician,d.status,d.date,d.notes,d.completedAt,d.updatedAt];
    if(found>0)sh.getRange(found,1,1,row.length).setValues([row]);
    else sh.appendRow(row);
    return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);
  }catch(err){
    return ContentService.createTextOutput(JSON.stringify({error:err.message})).setMimeType(ContentService.MimeType.JSON);
  }
}`;
  return`<div style="max-width:580px"><div class="pg-header"><div><div class="pg-title">Settings</div><div class="pg-sub">Configure NexTrack for your business</div></div></div><form id="settings-form"><div class="card" style="padding:22px;margin-bottom:14px"><div class="section-label">Business Details</div><div class="field"><label>Business Name</label><input name="businessName" value="${esc(c.businessName)}" placeholder="e.g. Pete's Auto Workshop"></div><div class="field" style="margin-bottom:0"><label>Technicians <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--subtle)">(one per line)</span></label><textarea name="technicianList" rows="4" placeholder="Andile&#10;Sipho&#10;James">${esc((c.technicianList||[]).join('\n'))}</textarea></div></div><div class="card" style="padding:22px;margin-bottom:14px"><div class="section-label">Make.com Webhook</div><div style="font-size:.8rem;color:var(--muted);margin-bottom:12px">Fires when a job is marked Done — triggers WhatsApp notification to client via Make.com.</div><div class="field" style="margin-bottom:0"><label>Webhook URL</label><input name="makeWebhookUrl" value="${esc(c.makeWebhookUrl)}" placeholder="https://hook.us2.make.com/…"></div></div><div class="card" style="padding:22px;margin-bottom:14px"><div class="section-label">Google Sheets Sync <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--subtle)">(optional)</span></div><div style="font-size:.8rem;color:var(--muted);margin-bottom:14px">NexTrack syncs every job create, update, and delete to your sheet in real time. Uses a Google Apps Script web app as a relay — no OAuth needed.</div><div class="field" style="margin-bottom:14px"><label>Apps Script URL</label><input name="sheetsScriptUrl" value="${esc(c.sheetsScriptUrl||'')}" placeholder="https://script.google.com/macros/s/…/exec"></div><details style="margin-bottom:0"><summary style="font-family:var(--mono);font-size:.7rem;font-weight:500;color:var(--muted);cursor:pointer;user-select:none;padding:8px 0">How to set this up (one-time, 3 minutes)</summary><div style="margin-top:12px;font-size:.8rem;color:var(--muted);line-height:1.7"><ol style="padding-left:18px;margin-bottom:12px"><li>Open your Google Sheet → Extensions → Apps Script</li><li>Delete any existing code, paste the script below</li><li>Click Deploy → New deployment → Web app</li><li>Set "Execute as" = Me, "Who has access" = Anyone</li><li>Click Deploy, copy the URL, paste it above</li></ol><div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:monospace;font-size:.72rem;white-space:pre;overflow-x:auto;color:var(--text)">${esc(scriptCode)}</div></div></details></div><button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;margin-bottom:10px">Save Settings</button></form><button id="sync-all-btn" class="btn btn-secondary" style="width:100%;justify-content:center;padding:10px;margin-bottom:18px">Sync All Jobs to Sheets Now</button><div class="card" style="padding:18px 22px;border-color:rgba(220,38,38,0.2)"><div style="font-size:.82rem;font-weight:700;color:var(--red);margin-bottom:6px">Danger Zone</div><div style="font-size:.8rem;color:var(--muted);margin-bottom:12px">Permanently delete all job cards stored on this device.</div><button id="clear-all-btn" class="btn btn-danger btn-sm">Clear All Jobs</button></div></div>`;
}
function wireNav(){
  const side=document.querySelector('.sidebar');
  const dim=document.getElementById('nexDim');
  const burger=document.getElementById('nexBurger');
  function close(){ if(side) side.classList.remove('open'); if(dim) dim.classList.remove('on'); }
  function toggle(e){ if(e) e.stopPropagation(); if(!side) return; const on=!side.classList.contains('open'); side.classList.toggle('open',on); if(dim) dim.classList.toggle('on',on); }
  if(burger) burger.onclick=toggle;
  if(dim) dim.onclick=close;
  document.querySelectorAll('.sidebar .nav-item').forEach(el=>el.addEventListener('click', close));
}
function bind(){
  wireNav();
  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>set({page:el.dataset.nav})));
  document.querySelectorAll('[data-job]').forEach(el=>el.addEventListener('click',()=>set({page:'job-detail',selectedJobId:el.dataset.job})));
  document.querySelectorAll('[data-status]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();setStatus(el.dataset.jobid,el.dataset.status);}));
  document.querySelectorAll('[data-delete]').forEach(el=>el.addEventListener('click',()=>deleteJob(el.dataset.delete)));
  document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>set({filterStatus:el.dataset.filter})));
  const sb=document.getElementById('search-box');if(sb){let t;sb.addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>set({searchQuery:e.target.value}),200);});sb.focus();}
  const njf=document.getElementById('new-job-form');if(njf)njf.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(njf);createJob({clientName:fd.get('clientName'),clientPhone:fd.get('clientPhone'),jobDescription:fd.get('jobDescription'),technician:fd.get('technician'),quoteRef:fd.get('quoteRef'),partsUsed:fd.get('partsUsed'),notes:fd.get('notes')});});
  const sf=document.getElementById('settings-form');if(sf)sf.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(sf);saveSettings({businessName:fd.get('businessName'),technicianList:fd.get('technicianList'),makeWebhookUrl:fd.get('makeWebhookUrl'),sheetsScriptUrl:fd.get('sheetsScriptUrl')});});
  const sab=document.getElementById('sync-all-btn');if(sab)sab.addEventListener('click',syncAllToSheets);
  const ssb=document.getElementById('sync-sheet-btn');if(ssb)ssb.addEventListener('click',syncJobsFromSheet);
  const snb=document.getElementById('save-notes-btn');if(snb)snb.addEventListener('click',()=>saveNotes(snb.dataset.jobid,document.getElementById('notes-field')?.value||''));
  const spb=document.getElementById('save-parts-btn');if(spb)spb.addEventListener('click',()=>savePartsUsed(spb.dataset.jobid,document.getElementById('parts-used-field')?.value||''));
  const cab=document.getElementById('clear-all-btn');if(cab)cab.addEventListener('click',()=>{if(confirm('Clear ALL job cards? Cannot be undone.')){DB.saveJobs([]);set({jobs:[],page:'dashboard'});toast('All jobs cleared','error');}});
}
